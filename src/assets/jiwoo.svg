<?xml version="1.0" encoding="UTF-8"?>
<svg id="jiwoo-cat-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="1200" height="900">
                                <defs>
                                    <!-- Clip path agar semua bagian tubuh kucing berhenti rapi tepat di atas garis batas bawah -->
                                    <clipPath id="above-line-clip">
                                        <rect x="0" y="0" width="600" height="352"/>
                                    </clipPath>

                                    <!-- Clip path untuk kontur dalam kepala kucing agar warna krem dan belang menempel presisi -->
                                    <clipPath id="head-shape-clip">
                                        <path d="M 218 153&#xA;                                                 C 217 125, 220 98, 225 90&#xA;                                                 C 231 82, 260 95, 286 113&#xA;                                                 C 320 109, 360 116, 388 131&#xA;                                                 C 417 119, 448 112, 456 121&#xA;                                                 C 464 130, 464 162, 459 192&#xA;                                                 C 478 232, 474 288, 441 320&#xA;                                                 L 442 355&#xA;                                                 L 185 355&#xA;                                                 L 186 245&#xA;                                                 C 188 205, 200 175, 218 153 Z"/>
                                    </clipPath>

                                    <!-- Clip path untuk tangan kanan yang melambai -->
                                    <clipPath id="waving-paw-clip">
                                        <path d="M 152 352&#xA;                                                 L 160 328&#xA;                                                 C 155 292, 146 255, 149 235&#xA;                                                 C 153 211, 184 203, 204 218&#xA;                                                 C 217 228, 222 252, 236 289&#xA;                                                 L 255 352 Z"/>
                                    </clipPath>
                                </defs>

                                <!-- GRUP UTAMA KUCING (Dipotong rapi pada garis batas bawah y=352) -->
                                <g clip-path="url(#above-line-clip)">
                                    
                                    <!-- ================= KEPALA & BADAN ================= -->
                                    <g id="cat-head-group">
                                        <!-- Kontur Isi Kepala & Badan (Di-clip agar belang & krem tidak keluar garis) -->
                                        <g clip-path="url(#head-shape-clip)">
                                            <!-- Warna Dasar Bulu Oranye (#FCA95D) -->
                                            <rect id="svg-fur-main" x="150" y="70" width="350" height="300" fill="#fca95d"/>

                                            <!-- Warna Krem Pipi, Moncong & Dada (#FFE0A3) -->
                                            <path id="svg-fur-cream" d="M 180 218&#xA;                                                     C 212 208, 250 216, 276 220&#xA;                                                     C 288 182, 297 162, 314 164&#xA;                                                     C 331 166, 336 188, 342 228&#xA;                                                     C 374 234, 412 246, 434 278&#xA;                                                     C 448 298, 450 330, 450 360&#xA;                                                     L 180 360 Z" fill="#ffe0a3"/>

                                            <!-- Telinga Dalam Kiri (Pink #F48C98) -->
                                            <g id="ear-left">
                                                <path id="svg-ear-left" d="M 226 156&#xA;                                                         C 225 132, 227 109, 232 103&#xA;                                                         C 237 97, 258 107, 274 120&#xA;                                                         C 254 130, 238 142, 226 156 Z" fill="#f48c98"/>
                                            </g>

                                            <!-- Telinga Dalam Kanan (Pink #F48C98) -->
                                            <path id="svg-ear-right" d="M 397 137&#xA;                                                     C 418 128, 441 124, 447 131&#xA;                                                     C 453 138, 452 162, 447 187&#xA;                                                     C 433 166, 417 149, 397 137 Z" fill="#f48c98"/>

                                            <!-- Belang / Stripes Kepala (#94622B) -->
                                            <g id="svg-head-stripes" fill="#94622b">
                                                <!-- 3 Belang Dahi -->
                                                <!-- Belang Dahi Kiri -->
                                                <path d="M 299 108 C 294 126, 290 140, 293 142 C 297 143, 304 128, 309 109 Z"/>
                                                <!-- Belang Dahi Tengah (Paling Panjang) -->
                                                <path d="M 318 109 C 310 138, 306 160, 310 162 C 315 163, 325 140, 332 111 Z"/>
                                                <!-- Belang Dahi Kanan -->
                                                <path d="M 342 113 C 335 135, 331 151, 335 153 C 339 154, 347 138, 353 116 Z"/>

                                                <!-- 2 Belang Kecil Pipi Kiri -->
                                                <path d="M 196 180 C 207 184, 215 190, 214 194 C 212 197, 203 193, 192 187 Z"/>
                                                <path d="M 189 197 C 200 201, 207 205, 206 209 C 204 212, 196 209, 186 204 Z"/>

                                                <!-- 2 Belang Pipi Kanan -->
                                                <path d="M 472 218 C 452 225, 436 229, 435 225 C 434 221, 450 214, 470 207 Z"/>
                                                <path d="M 474 235 C 452 240, 435 240, 435 236 C 435 232, 452 229, 473 225 Z"/>
                                            </g>
                                        </g>

                                        <!-- Garis Luar (Outline) Kepala, Telinga & Pipi (#593427) -->
                                        <g id="svg-head-outlines" fill="none" stroke="#593427" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
                                            <!-- Kontur Utama Kepala -->
                                            <path d="M 192 214&#xA;                                                     C 199 189, 207 170, 218 153&#xA;                                                     C 217 125, 220 98, 225 90&#xA;                                                     C 231 82, 260 95, 286 113&#xA;                                                     C 320 109, 360 116, 388 131&#xA;                                                     C 417 119, 448 112, 456 121&#xA;                                                     C 464 130, 464 162, 459 192&#xA;                                                     C 478 232, 474 288, 441 320&#xA;                                                     L 442 342"/>
                                            
                                            <!-- Garis Lipatan Pangkal Telinga Kiri -->
                                            <path d="M 218 153 C 236 135, 258 121, 286 113"/>
                                            
                                            <!-- Garis Lipatan Pangkal Telinga Kanan -->
                                            <path d="M 388 131 C 394 134, 399 137, 403 140"/>
                                        </g>

                                        <!-- ================= FITUR WAJAH (MATA, HIDUNG, MULUT) ================= -->
                                        <g id="cat-face-features">
                                            <!-- Mata Kiri -->
                                            <g transform="translate(251, 201) rotate(8)">
                                                <ellipse cx="0" cy="0" rx="15.5" ry="14.5" fill="#593427"/>
                                                <circle cx="-5.5" cy="-4.5" r="4.2" fill="#FFFFFF"/>
                                            </g>

                                            <!-- Mata Kanan -->
                                            <g transform="translate(356, 218) rotate(8)">
                                                <ellipse cx="0" cy="0" rx="15.5" ry="14.5" fill="#593427"/>
                                                <circle cx="-5.5" cy="-4.5" r="4.2" fill="#FFFFFF"/>
                                            </g>

                                            <!-- Hidung Segitiga Membulat -->
                                            <path d="M 290 225&#xA;                                                     C 296 222, 307 224, 311 229&#xA;                                                     C 314 233, 305 242, 299 242&#xA;                                                     C 293 241, 286 229, 290 225 Z" fill="#593427"/>

                                            <!-- Garis Mulut Melengkung Manis ('w') -->
                                            <path d="M 299 239 L 296 250" fill="none" stroke="#593427" stroke-width="6" stroke-linecap="round"/>
                                            <path d="M 268 245 C 277 254, 291 255, 296 249" fill="none" stroke="#593427" stroke-width="6" stroke-linecap="round"/>
                                            <path d="M 296 249 C 301 256, 317 259, 329 253" fill="none" stroke="#593427" stroke-width="6" stroke-linecap="round"/>
                                        </g>
                                    </g>

                                    <!-- ================= TANGAN KANAN (MELAMBAI DI SISI KIRI) ================= -->
                                    <g id="waving-arm">
                                        <g clip-path="url(#waving-paw-clip)">
                                            <!-- Warna Dasar Oranye Tangan -->
                                            <rect x="135" y="195" width="130" height="170" fill="#fca95d"/>

                                            <!-- Belang Lengan (#94622B) -->
                                            <g fill="#94622b">
                                                <!-- 2 Belang di sisi kiri bawah telapak -->
                                                <path d="M 150 289 C 165 285, 179 286, 179 291 C 179 296, 166 299, 151 301 Z"/>
                                                <path d="M 153 312 C 164 306, 174 306, 175 310 C 176 314, 166 320, 155 323 Z"/>
                                                <!-- 2 Belang di sisi dalam lengan kanan -->
                                                <path d="M 230 272 C 221 274, 215 277, 216 281 C 217 284, 224 282, 233 279 Z"/>
                                                <path d="M 236 289 C 224 291, 216 294, 217 298 C 218 302, 227 300, 239 296 Z"/>
                                            </g>

                                            <!-- Bantalan Telapak Kaki (Pink Paw Pads #F48C98) -->
                                            <g fill="#f48c98">
                                                <!-- Bantalan Tengah Utama -->
                                                <ellipse cx="184" cy="259" rx="14.5" ry="10.5" transform="rotate(-8 184 259)"/>
                                                <!-- 4 Toe Beans (Jari-jari) -->
                                                <ellipse cx="161" cy="246" rx="4.8" ry="6.8" transform="rotate(-24 161 246)"/>
                                                <ellipse cx="173" cy="233" rx="5" ry="7.2" transform="rotate(-10 173 233)"/>
                                                <ellipse cx="189" cy="232" rx="5" ry="7.2" transform="rotate(6 189 232)"/>
                                                <ellipse cx="203" cy="242" rx="4.8" ry="6.8" transform="rotate(22 203 242)"/>
                                            </g>
                                        </g>

                                        <!-- Garis Luar (Outline) Tangan Melambai -->
                                        <path d="M 152 352&#xA;                                                 L 160 328&#xA;                                                 C 155 292, 146 255, 149 235&#xA;                                                 C 153 211, 184 203, 204 218&#xA;                                                 C 217 228, 222 252, 236 289" fill="none" stroke="#593427" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    </g>
                                </g>

                                <!-- ================= GARIS BATAS HORIZONTAL ================= -->
                                <line x1="94" y1="352" x2="518" y2="352" stroke="#593427" stroke-width="6.5" stroke-linecap="round"/>

                                <!-- ================= TANGAN KIRI (BERTUMPU DI ATAS GARIS) ================= -->
                                <g id="resting-paw">
                                    <!-- Isi Oranye Tangan Kiri -->
                                    <path d="M 366 352&#xA;                                             C 356 332, 366 309, 395 309&#xA;                                             C 424 309, 434 330, 429 352&#xA;                                             Z" fill="#fca95d"/>
                                    
                                    <!-- Bayangan/Aksen Kecil di Sisi Kanan Tangan -->
                                    <path d="M 430 330 C 438 336, 441 344, 442 352 L 427 352 Z" fill="#fca95d"/>

                                    <!-- Garis Luar Tangan Kiri (Sedikit melewati garis bawah agar terlihat bertumpu) -->
                                    <path d="M 366 352&#xA;                                             C 356 332, 366 309, 395 309&#xA;                                             C 424 309, 434 330, 429 352&#xA;                                             C 418 356, 377 356, 366 352 Z" fill="#fca95d" stroke="#593427" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

                                    <!-- Garis Sisi Luar Lengan Kanan Bawah -->
                                    <path d="M 432 325 C 438 334, 441 343, 442 352" fill="#fca95d" stroke="#593427" stroke-width="6.5" stroke-linecap="round"/>

                                    <!-- 3 Garis Jari Tangan Kiri -->
                                    <path d="M 380 353 C 378 345, 378 338, 380 334" fill="#fca95d" stroke="#593427" stroke-width="6" stroke-linecap="round"/>
                                    <path d="M 397 354 C 396 344, 396 336, 397 331" fill="#fca95d" stroke="#593427" stroke-width="6" stroke-linecap="round"/>
                                    <path d="M 414 353 C 414 345, 413 338, 412 334" fill="#fca95d" stroke="#593427" stroke-width="6" stroke-linecap="round"/>
                                </g>
                            </svg>